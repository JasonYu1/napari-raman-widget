[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-raman-widget"
version = "0.1.0"
description = "Napari widget for controlling the Raman microscopy rig"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Jason W. Yu" },
]
dependencies = [
    "cellpose>=3.1.1.3,<4",
    "racer-raman[io] @ git+https://github.com/JasonYu1/racer-raman.git@a640a53362880fb3010bafa7d735c8a9851830ec",
    "matplotlib",
    "mda-simulator",
    "napari",
    "napari-broadcastable-points",
    "napari-micromanager",
    "nidaqmx",
    "numpy",
    "pandas>=2",
    "pymmcore-plus",
    "qtpy",
    "requests",
    "raman-control @ git+https://github.com/JasonYu1/raman-control.git@5cc3e46f2faa1075806b2f16b1bd80deba5c4b2c",
    "raman-mda-engine @ git+https://github.com/JasonYu1/raman-mda-engine.git@a90f67e660c2d3b25fdad24bf6b0e70091368aad",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "tifffile",
    "torch<2.9; sys_platform == 'win32'",
    "tqdm",
    "useq-schema",
    # Xarray 2026.4+ requires zarr-python 3; RACER's IO uses zarr-python 2.
    "xarray<2026.4",
    "zarr>=2.15,<3",
]

[project.optional-dependencies]
test = [
    "PyQt5>=5.15",
]

[project.urls]
Repository = "https://github.com/JasonYu1/napari-raman-widget"
Issues = "https://github.com/JasonYu1/napari-raman-widget/issues"

[tool.setuptools.packages.find]
include = ["napari_raman_widget*"]

[tool.setuptools.package-data]
napari_raman_widget = [
    "resources/*.pdf",
    "resources/*.tex",
]
