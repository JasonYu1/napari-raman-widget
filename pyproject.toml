[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-raman-widget"
version = "0.1.0"
description = "Napari widget for controlling the Raman microscopy rig"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Jason W. Yu" },
]
dependencies = [
    "matplotlib",
    "mda-simulator",
    "napari",
    "napari-broadcastable-points",
    "napari-micromanager",
    "nidaqmx",
    "numpy",
    "pandas",
    "pymmcore-plus",
    "qtpy",
    "raman-control @ git+https://github.com/JasonYu1/raman-control.git@main",
    "raman-mda-engine @ git+https://github.com/JasonYu1/raman-mda-engine.git@main",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "tifffile",
    "tqdm",
    "useq-schema",
    "xarray",
    "zarr",
]

[project.urls]
Repository = "https://github.com/JasonYu1/napari-raman-widget"
Issues = "https://github.com/JasonYu1/napari-raman-widget/issues"

[tool.setuptools.packages.find]
include = ["napari_raman_widget*"]

[tool.setuptools.package-data]
napari_raman_widget = [
    "resources/*.pdf",
    "resources/*.tex",
]
