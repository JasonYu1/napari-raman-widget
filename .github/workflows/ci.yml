name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    env:
      MPLBACKEND: Agg
      NUMBA_DISABLE_JIT: "1"
      PYTEST_RUNNING: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  package:
    name: Build and inspect package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Compile Python sources
        run: python -m compileall -q napari_raman_widget

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check package metadata and descriptions
        run: python -m twine check dist/*

      - name: Verify wheel imports without runtime dependencies
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import napari_raman_widget; print(napari_raman_widget.__version__)"
